[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "driftwatch"
version = "0.2.0"
description = "A self-monitoring electricity-demand forecasting service that flags its own decay."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Madhur" }]
keywords = ["mlops", "monitoring", "drift", "forecasting", "energy"]
dependencies = [
    # ingestion
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
    # modeling
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "scipy>=1.10",
    "joblib>=1.3",
    # serving
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
driftwatch = "driftwatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = [
    # Known-benign third-party deprecations (not our code):
    "ignore:Using `httpx` with `starlette.testclient`",
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# dashboard.py embeds a self-contained HTML/CSS/JS page as a string literal;
# long lines there are markup, not Python logic.
"src/driftwatch/dashboard.py" = ["E501"]
